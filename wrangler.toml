name = "scribblewriter"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serves the built frontend as static assets; the Worker's fetch handler
# only runs for requests that don't match a static file (e.g. /api/*),
# and for the SPA fallback.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "scribblewriter-db"
database_id = "c59a848b-6933-40c4-8954-e07f7725319f"

# Secrets (set via `wrangler secret put`, not in this file):
#   ANTHROPIC_API_KEY   - server-side key for AI placement calls
#   SESSION_SECRET       - random string used to sign session cookies
